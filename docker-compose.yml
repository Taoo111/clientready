services:
  postgres:
    image: postgres:16-alpine
    container_name: clientready-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clientready}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clientready}
      POSTGRES_DB: ${POSTGRES_DB:-clientready}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clientready} -d ${POSTGRES_DB:-clientready}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
