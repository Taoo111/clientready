# Render Blueprint: API (NestJS) as a free Docker web service in Frankfurt.
# Secrets (sync: false) are entered in the Render dashboard when the Blueprint is created.
services:
  - type: web
    name: clientready-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase: Connect → Session pooler (port 5432), append ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Supabase: Database settings → SSL → download the CA certificate, paste the PEM here
      - key: DATABASE_SSL_CA
        sync: false
      # The Vercel production URL, e.g. https://clientready.vercel.app (no trailing slash)
      - key: WEB_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: EVAL_PROVIDER
        value: openai
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: recordings
      - key: DATA_RETENTION_DAYS
        value: '90'
